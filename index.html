<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Drink App</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container mt-5">
      <!-- Search -->
      <div class="row mb-4">
        <div class="col-md-8 mx-auto">
          <div class="input-group">
            <input
              type="text"
              id="search"
              class="form-control"
              placeholder="Search drink..."
            />

            <button class="btn btn-primary" id="searchBtn">Search</button>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-8">
          <div class="row" id="drinkContainer"></div>
        </div>

        <div class="col-md-4">
          <div class="card selected-card">
            <div class="card-header bg-primary text-white">
              <h5 class="mb-0">Total Item</h5>
            </div>

            <div class="card-body">
              <h6>
                Total Drink:
                <span id="drinkCount" class="badge bg-success"> 0 </span>
              </h6>

              <hr />

              <div id="selectedDrinks">
                <table class="table">
                  <thead>
                    <tr>
                      <th>#sl</th>
                      <th>Image</th>
                      <th>Name</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="product_cart_row">
                    <tr>
                        <td></td>
                        <td><p class="text-muted">No drink selected.</p></td>
                        <td></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Details Modal -->
    <div class="modal fade" id="drinkModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalDrinkName">Drink Details</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body" id="modalBody"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="api.js"></script>
  </body>
</html>
